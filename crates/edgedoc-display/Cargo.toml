[package]
name = "edgedoc-display"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false
description = "Facade: open a Word document and paint its pages"

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
edgedoc = { workspace = true }
edgedoc-geom = { workspace = true }
edgedoc-fonts = { workspace = true }
edgedoc-text = { workspace = true }
edgedoc-style = { workspace = true }
edgedoc-flow = { workspace = true }
edgedoc-paint = { workspace = true }
edgedoc-model = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
edgedoc-demos = { path = "../edgedoc-demos" }

[lints]
workspace = true
