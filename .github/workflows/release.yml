name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  crates:
    name: crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.76.0
      - uses: Swatinem/rust-cache@v2
      - name: Publish the core crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::notice::crates.io publication skipped: CARGO_REGISTRY_TOKEN is not configured. GitHub release assets are published separately."
            exit 0
          fi
          for crate in edgedoc-limit edgedoc-unit edgedoc-model edgedoc-opc edgedoc-merge edgedoc-wml edgedoc; do
            cargo publish -p "$crate" --no-verify
            sleep 20
          done

  python:
    name: PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.76.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and publish the wheel
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${MATURIN_PYPI_TOKEN}" ]; then
            echo "::notice::PyPI publication skipped: PYPI_API_TOKEN is not configured."
            exit 0
          fi
          python3 -m pip install --upgrade pip maturin
          maturin publish --manifest-path crates/edgedoc-py/Cargo.toml --features python

  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: Build the package
        run: make package-wasm
      - name: Publish edgedoc-wasm
        working-directory: packages/edgedoc-wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::notice::npm registry publication skipped: NPM_TOKEN is not configured. Install the versioned tarball from the GitHub release."
            exit 0
          fi
          npm publish --access public

  github-assets:
    name: GitHub release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: Verify release identity
        run: node -e 'const p=require("./packages/edgedoc-wasm/package.json"); if (`v${p.version}` !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - name: Build matching server and browser distributions
        run: make package-wasm
      - name: Package immutable release assets
        run: |
          mkdir -p release
          npm pack ./packages/edgedoc-wasm --pack-destination release
          tar -czf "release/edgedoc-display-${GITHUB_REF_NAME#v}.tgz" -C site/display edgedoc-viewer.js edgedoc_display.js edgedoc_display_bg.wasm
          (cd release && sha256sum *.tgz > SHA256SUMS)
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "EdgeDoc $GITHUB_REF_NAME"
