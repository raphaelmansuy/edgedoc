name: release

on:
  push:
    tags:
      - "v*"

jobs:
  crates:
    name: crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.76.0
      - uses: Swatinem/rust-cache@v2
      - name: Publish the core crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::Add repository secret CARGO_REGISTRY_TOKEN before release."
            exit 1
          fi
          for crate in edgedoc-limit edgedoc-unit edgedoc-model edgedoc-opc edgedoc-merge edgedoc-wml edgedoc; do
            cargo publish -p "$crate" --no-verify
            sleep 20
          done

  python:
    name: PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.76.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and publish the wheel
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python3 -m pip install --upgrade pip maturin
          maturin publish --manifest-path crates/edgedoc-py/Cargo.toml --features python

  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: Build the package
        run: make package-wasm
      - name: Publish edgedoc-wasm
        working-directory: packages/edgedoc-wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
