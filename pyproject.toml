[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "edgedoc"
version = "0.3.1"
description = "Read, create, edit, merge, and save Word documents"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.maturin]
manifest-path = "crates/edgedoc-py/Cargo.toml"
module-name = "edgedoc._native"
features = ["python"]
python-source = "python"
