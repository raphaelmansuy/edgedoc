[workspace]
resolver = "2"
members = [
  "crates/edgedoc-limit",
  "crates/edgedoc-unit",
  "crates/edgedoc-model",
  "crates/edgedoc-opc",
  "crates/edgedoc-wml",
  "crates/edgedoc-merge",
  "crates/edgedoc",
  "crates/edgedoc-py",
  "crates/edgedoc-wasm",
  "crates/edgedoc-demos",
  "crates/edgedoc-geom",
  "crates/edgedoc-fonts",
  "crates/edgedoc-text",
  "crates/edgedoc-style",
  "crates/edgedoc-flow",
  "crates/edgedoc-paint",
  "crates/edgedoc-display",
  "crates/edgedoc-display-wasm",
]
default-members = [
  "crates/edgedoc-limit",
  "crates/edgedoc-unit",
  "crates/edgedoc-model",
  "crates/edgedoc-opc",
  "crates/edgedoc-wml",
  "crates/edgedoc-merge",
  "crates/edgedoc",
  "crates/edgedoc-py",
  "crates/edgedoc-wasm",
  "crates/edgedoc-demos",
  "crates/edgedoc-geom",
  "crates/edgedoc-fonts",
  "crates/edgedoc-text",
  "crates/edgedoc-style",
  "crates/edgedoc-flow",
  "crates/edgedoc-paint",
  "crates/edgedoc-display",
  "crates/edgedoc-display-wasm",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.76"
repository = "https://github.com/raphaelmansuy/edgedoc"
homepage = "https://raphaelmansuy.github.io/edgedoc/"
documentation = "https://docs.rs/edgedoc"

[workspace.dependencies]
edgedoc-limit = { version = "0.3.0", path = "crates/edgedoc-limit" }
edgedoc-unit = { version = "0.3.0", path = "crates/edgedoc-unit" }
edgedoc-model = { version = "0.3.0", path = "crates/edgedoc-model" }
edgedoc-opc = { version = "0.3.0", path = "crates/edgedoc-opc" }
edgedoc-wml = { version = "0.3.0", path = "crates/edgedoc-wml" }
edgedoc-merge = { version = "0.3.0", path = "crates/edgedoc-merge" }
edgedoc = { version = "0.3.0", path = "crates/edgedoc", default-features = true }
edgedoc-geom = { version = "0.3.0", path = "crates/edgedoc-geom" }
edgedoc-fonts = { version = "0.3.0", path = "crates/edgedoc-fonts" }
edgedoc-text = { version = "0.3.0", path = "crates/edgedoc-text" }
edgedoc-style = { version = "0.3.0", path = "crates/edgedoc-style" }
edgedoc-flow = { version = "0.3.0", path = "crates/edgedoc-flow" }
edgedoc-paint = { version = "0.3.0", path = "crates/edgedoc-paint" }
edgedoc-display = { version = "0.3.0", path = "crates/edgedoc-display" }
edgedoc-display-wasm = { version = "0.3.0", path = "crates/edgedoc-display-wasm" }
thiserror = "1.0"
quick-xml = "0.31"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
ttf-parser = "0.21"
rustybuzz = "0.14"
unicode-bidi = "0.3.13"
unicode-linebreak = "0.1"
unicode-segmentation = "=1.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.108"
base64 = "0.22"
wasm-bindgen = "0.2.100"
js-sys = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
